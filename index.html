<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Test Ad</title>
  <meta name="description" content="Shop now">

  <!-- Open Graph / Facebook + general -->
  <meta property="og:title" content="Our Test Ad">
  <meta property="og:description" content="Shop now">
  <meta property="og:image" content="https://i.ibb.co/tw7CxL7C/image.png">
  <meta property="og:image:width" content="1200">   <!-- recommended: helps X/FB scale properly -->
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://powerful122.github.io/Test-Ad/">
  <meta property="og:type" content="website">

  <!-- Twitter/X specific -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Our Test Ad">
  <meta name="twitter:description" content="Shop now">
  <meta name="twitter:image" content="https://i.ibb.co/tw7CxL7C/image.png">

  <!-- Auto-redirect after 2 seconds (X bot reads faster than this) -->
  <meta http-equiv="refresh" content="2; url=https://enkaare.com">

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }
    img {
      max-width: 90%;
      max-height: 70vh;
      height: auto;
      border-radius: 8px;
    }
    .button {
      margin-top: 25px;
      padding: 15px 40px;
      background: #ffffff;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.2em;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .button:hover {
      background: #e0e0e0;
    }
    .notice {
      margin-top: 20px;
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
</head>
<body>
  <img src="https://i.ibb.co/tw7CxL7C/image.png" alt="Our Test Ad">

  <a href="https://enkaare.com" class="button">SHOP NOW</a>

  <p class="notice">Redirecting to enkaare.com in a few seconds... or click above.</p>

  <!-- Optional: Fallback JS redirect if meta fails (some browsers block meta refresh) -->
  <script>
    setTimeout(function() {
      window.location.href = "https://enkaare.com";
    }, 2000);
  </script>
</body>
</html>
